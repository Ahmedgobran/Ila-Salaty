<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <style>
      .dome { fill: #0D7377; }
    </style>
  </defs>
  <!-- Main dome -->
  <path class="dome" d="
    M36 72
    Q36 40 64 28
    Q92 40 92 72
    L92 78
    L36 78
    Z
  "/>
  <!-- Base / walls -->
  <rect class="dome" x="30" y="78" width="68" height="18" rx="2"/>
  <!-- Left minaret -->
  <rect class="dome" x="18" y="50" width="8" height="46" rx="2"/>
  <rect class="dome" x="16" y="92" width="12" height="6" rx="1"/>
  <circle class="dome" cx="22" cy="47" r="5.5"/>
  <!-- Finial left -->
  <rect class="dome" x="21" y="38" width="2" height="6"/>
  <circle class="dome" cx="22" cy="36" r="2"/>
  <!-- Right minaret -->
  <rect class="dome" x="102" y="50" width="8" height="46" rx="2"/>
  <rect class="dome" x="100" y="92" width="12" height="6" rx="1"/>
  <circle class="dome" cx="106" cy="47" r="5.5"/>
  <!-- Finial right -->
  <rect class="dome" x="105" y="38" width="2" height="6"/>
  <circle class="dome" cx="106" cy="36" r="2"/>
  <!-- Crescent moon on dome -->
  <g transform="translate(64, 20)">
    <!-- Crescent: outer circle minus inner offset circle -->
    <path class="dome" d="
      M-1 -8
      A8 8 0 1 1 -1 8
      A6.5 6.5 0 1 0 -1 -8
      Z
    "/>
  </g>
  <!-- Door arch -->
  <path fill="#071E2F" d="
    M56 96
    L56 82
    Q56 74 64 74
    Q72 74 72 82
    L72 96
    Z
  " opacity="0.4"/>
</svg>
