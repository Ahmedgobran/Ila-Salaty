<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E5254"/>
      <stop offset="50%" stop-color="#0A3D3F"/>
      <stop offset="100%" stop-color="#071E2F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0D48A"/>
      <stop offset="100%" stop-color="#D4A843"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle Badge -->
  <rect x="7" y="7" width="114" height="114" rx="26" fill="url(#bgGrad)" stroke="#D4A843" stroke-width="1.8" stroke-opacity="0.28"/>
  
  <g fill="url(#goldGrad)">
    <!-- Base Plinth -->
    <rect x="22" y="96" width="84" height="5" rx="2.5" fill="#D4A843"/>
    
    <!-- Left Minaret -->
    <rect x="26" y="44" width="8" height="52" rx="1.2" fill="#D4A843"/>
    <rect x="22" y="40" width="16" height="4" rx="1.5"/>
    <rect x="27.5" y="30" width="5" height="10" fill="#D4A843"/>
    <polygon points="26,30 34,30 30,17"/>
    <circle cx="30" cy="15.8" r="1.3"/>
    
    <!-- Right Minaret -->
    <rect x="94" y="44" width="8" height="52" rx="1.2" fill="#D4A843"/>
    <rect x="90" y="40" width="16" height="4" rx="1.5"/>
    <rect x="95.5" y="30" width="5" height="10" fill="#D4A843"/>
    <polygon points="94,30 102,30 98,17"/>
    <circle cx="98" cy="15.8" r="1.3"/>
    
    <!-- Main Hall Building with Cutout Arched Doorway -->
    <path d="M40 96 V63 H88 V96 H72 V80 C72 73.5 64 69 64 69 C64 69 56 73.5 56 80 V96 Z" fill="#D4A843"/>
    
    <!-- Central Pointed Ogee Dome -->
    <path d="M42 63 C39 47 51 35 64 27 C77 35 89 47 86 63 Z"/>
    
    <!-- Dome Spire Rod -->
    <rect x="63.2" y="19" width="1.6" height="8"/>
  </g>
  
  <!-- Crescent Moon at Dome Peak -->
  <path d="M64 8 A7 7 0 1 1 59 19.5 A5.8 5.8 0 1 0 64 8 Z" fill="#F8F4E8"/>
</svg>
