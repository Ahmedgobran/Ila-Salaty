<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360">
  <title>إلا صلاتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header__brand">
      <!-- Inline mosque SVG icon -->
      <svg class="header__icon" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <g fill="currentColor">
          <!-- Dome -->
          <path d="M8 18 Q8 10 16 8 Q24 10 24 18 L24 20 L8 20 Z" opacity="0.9"/>
          <!-- Base -->
          <rect x="6" y="20" width="20" height="4" rx="1"/>
          <!-- Minaret left -->
          <rect x="4" y="12" width="2.5" height="12" rx="1"/>
          <circle cx="5.25" cy="11" r="1.8"/>
          <!-- Minaret right -->
          <rect x="25.5" y="12" width="2.5" height="12" rx="1"/>
          <circle cx="26.75" cy="11" r="1.8"/>
          <!-- Crescent on dome -->
          <path d="M15.5 6.5 A2.5 2.5 0 1 1 17 8.5 A2 2 0 1 0 15.5 6.5" fill="currentColor"/>
        </g>
      </svg>
      <h1 class="header__title">إلا صلاتي</h1>
    </div>
    <div class="header__date">
      <span id="dateGregorian" dir="ltr" lang="en"></span>
      <span class="header__date-sep">·</span>
      <span id="dateHijri" dir="rtl" lang="ar"></span>
    </div>
  </header>

  <!-- Prayer Times -->
  <section class="prayers" aria-label="Prayer times">
    <div class="prayer-row" data-prayer="fajr">
      <div class="prayer-row__names">
        <span class="prayer-row__ar" lang="ar">الفجر</span>
        <span class="prayer-row__en" dir="ltr" lang="en">Fajr</span>
      </div>
      <span class="prayer-row__time" dir="ltr" id="timeFajr">--:--</span>
    </div>
    <div class="prayer-row" data-prayer="dhuhr">
      <div class="prayer-row__names">
        <span class="prayer-row__ar" lang="ar">الظهر</span>
        <span class="prayer-row__en" dir="ltr" lang="en">Dhuhr</span>
      </div>
      <span class="prayer-row__time" dir="ltr" id="timeDhuhr">--:--</span>
    </div>
    <div class="prayer-row" data-prayer="asr">
      <div class="prayer-row__names">
        <span class="prayer-row__ar" lang="ar">العصر</span>
        <span class="prayer-row__en" dir="ltr" lang="en">Asr</span>
      </div>
      <span class="prayer-row__time" dir="ltr" id="timeAsr">--:--</span>
    </div>
    <div class="prayer-row" data-prayer="maghrib">
      <div class="prayer-row__names">
        <span class="prayer-row__ar" lang="ar">المغرب</span>
        <span class="prayer-row__en" dir="ltr" lang="en">Maghrib</span>
      </div>
      <span class="prayer-row__time" dir="ltr" id="timeMaghrib">--:--</span>
    </div>
    <div class="prayer-row" data-prayer="isha">
      <div class="prayer-row__names">
        <span class="prayer-row__ar" lang="ar">العشاء</span>
        <span class="prayer-row__en" dir="ltr" lang="en">Isha</span>
      </div>
      <span class="prayer-row__time" dir="ltr" id="timeIsha">--:--</span>
    </div>

    <!-- Next prayer countdown -->
    <div class="next-prayer" id="nextPrayerInfo">
      <span class="next-prayer__label" dir="ltr" lang="en">Next prayer in</span>
      <span class="next-prayer__countdown" dir="ltr" id="nextCountdown">--</span>
    </div>
  </section>

  <!-- Settings toggle -->
  <button class="settings-toggle" id="settingsToggle" aria-expanded="false" aria-controls="settingsPanel">
    <svg class="settings-toggle__icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54A.484.484 0 0 0 13.91 2h-3.82c-.25 0-.46.18-.49.42l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.72 8.47c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.49.41h3.82c.25 0 .46-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
    </svg>
    <span dir="ltr" lang="en">Settings</span>
    <span dir="rtl" lang="ar">الإعدادات</span>
    <svg class="settings-toggle__chevron" viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
      <path fill="currentColor" d="M6 8l4 4 4-4"/>
    </svg>
  </button>

  <!-- Settings Panel (collapsible) -->
  <section class="settings" id="settingsPanel" hidden>
    <!-- Location -->
    <div class="settings__group">
      <label class="settings__label settings__label--location" dir="ltr" lang="en">Location</label>
      
      <!-- Location Card -->
      <div class="location-card" dir="ltr">
        <div class="location-card__header">
          <svg class="location-card__pin" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          <span class="location-card__city" id="locationCityName">Mecca</span>
        </div>

        <div class="location-card__actions">
          <button type="button" class="location-card__btn" id="detectLocation">
            <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
              <circle cx="10" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M10 2v4M10 14v4M2 10h4M14 10h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Detect location
          </button>
          <button type="button" class="location-card__btn" id="changeCityBtn">
            <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
              <path fill="currentColor" d="M13.586 3.586a2 2 0 1 1 2.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
            </svg>
            Change city
          </button>
        </div>

        <!-- Inline City Search Drawer -->
        <div class="location-card__search" id="citySearchContainer" hidden>
          <div class="city-search__row">
            <input type="text" id="citySearchInput" class="city-search__input" placeholder="Search city (e.g. Shah Alam, Cairo)..." autocomplete="off">
            <button type="button" class="city-search__btn" id="citySearchBtn">Find</button>
            <button type="button" class="city-search__cancel" id="citySearchCancel" aria-label="Cancel">✕</button>
          </div>
          <div class="city-search__results" id="citySearchResults" hidden></div>
        </div>
      </div>

      <!-- Collapsible Manual Coordinates -->
      <button type="button" class="coords-toggle" id="toggleCoordsBtn" aria-expanded="false" dir="ltr">
        <span>Enter coordinates manually</span>
        <svg class="coords-toggle__chevron" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M6 8l4 4 4-4"/>
        </svg>
      </button>

      <div class="coords-panel" id="manualCoordsPanel" hidden dir="ltr">
        <div class="settings__row">
          <div class="settings__field">
            <label class="settings__sub-label" for="inputLat" dir="ltr">Lat</label>
            <input type="number" id="inputLat" class="settings__input" step="0.0001" placeholder="21.4225">
          </div>
          <div class="settings__field">
            <label class="settings__sub-label" for="inputLng" dir="ltr">Lng</label>
            <input type="number" id="inputLng" class="settings__input" step="0.0001" placeholder="39.8262">
          </div>
        </div>
      </div>
    </div>

    <!-- Calculation Method -->
    <div class="settings__group">
      <label class="settings__label" for="calcMethod" dir="ltr" lang="en">Calculation Method</label>
      <select id="calcMethod" class="settings__select">
        <option value="MWL">Muslim World League</option>
        <option value="JAKIM">Malaysia (JAKIM)</option>
        <option value="Singapore">Singapore (MUIS)</option>
        <option value="Makkah">Umm al-Qura (Makkah)</option>
        <option value="Egypt">Egyptian General Authority</option>
        <option value="Karachi">University of Islamic Sciences, Karachi</option>
        <option value="ISNA">ISNA (North America)</option>
        <option value="Dubai">Dubai (UAE)</option>
        <option value="Diyanet">Turkey (Diyanet)</option>
      </select>
    </div>

    <!-- Lockscreen toggle -->
    <div class="settings__group settings__group--row">
      <label class="settings__label" for="lockscreenToggle" dir="ltr" lang="en">Lock Screen</label>
      <label class="toggle" aria-label="Enable or disable lock screen">
        <input type="checkbox" id="lockscreenToggle" checked>
        <span class="toggle__slider"></span>
      </label>
    </div>

    <!-- Adhan sound toggle + volume -->
    <div class="settings__group settings__group--row">
      <label class="settings__label" for="soundToggle" dir="ltr" lang="en">Adhan Sound</label>
      <label class="toggle" aria-label="Enable or disable adhan sound">
        <input type="checkbox" id="soundToggle" checked>
        <span class="toggle__slider"></span>
      </label>
    </div>
    <div class="settings__group" id="volumeGroup">
      <label class="settings__label settings__label--small" for="volumeSlider" dir="ltr" lang="en">
        Volume: <span id="volumeLabel">80%</span>
      </label>
      <div class="settings__volume-row" dir="ltr">
        <button class="settings__btn--preview" id="previewSound" title="Preview adhan sound" aria-label="Preview adhan sound" type="button">▶</button>
        <input type="range" id="volumeSlider" class="settings__volume" min="0" max="100" value="80" step="5" dir="ltr">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="flex-shrink:0;opacity:0.65">
          <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </div>
    </div>

    <!-- Save -->
    <button class="settings__btn settings__btn--save" id="saveSettings" dir="ltr">
      Save Settings
    </button>
    <button class="settings__btn settings__btn--test" id="testLockscreen" dir="ltr" style="margin-top: 8px; background: rgba(13, 115, 119, 0.2); border: 1px solid var(--teal); color: var(--gold); cursor: pointer; padding: 8px 12px; border-radius: 6px; font-size: 13px; width: 100%; font-family: inherit; transition: all 0.2s ease;">
      ▶ Test Lock Screen Now (تجربة شاشة التذكير)
    </button>
    <p class="settings__status" id="saveStatus" dir="ltr" aria-live="polite"></p>
  </section>

  <script src="popup.js"></script>
</body>
</html>
